name: 시장 예상 (cloud)

# GitHub 서버에서 하루 2회, "장이 열려 있는 동안" 자동 실행 (내 PC 불필요).
#
#   📌 발행 시각 고정 (독자가 언제 볼지 알아야 하므로):
#      🇰🇷 매일 14:10 분석 시작 → **~14:30 리포트·체결** → 독자는 15:30 마감 전까지 매수
#      🇺🇸 매일 23:30 분석 시작 → **~23:45 리포트·체결** → 독자는 장중 바로 매수
#
#   ⚠️ GitHub 예약실행은 최대 2~3시간 지연될 수 있다(실측 +2h20m, 정상 동작).
#      그래서 크론을 목표보다 ~3h 일찍 걸고, "목표 시각까지 대기" 스텝이 정확한 시각에 시작시킨다.
#      → 발행 시각이 매일 같아진다. (지연이 목표를 넘겼으면 즉시 실행)
#
#   🕐 2026-08-04 개편 — 발행이 목표(14:45)를 한 번도 못 지키고 15:27까지 밀린 문제 대응:
#      ① 매니저 4인을 **병렬 실행**(기존 순차 → AI 구간 절반). ② 🇰🇷 시작을 14:30 → **14:10**.
#      ③ 🇺🇸는 시작을 못 당긴다(겨울 개장이 23:30). 대신 병렬화로 자정 전에 끝낸다.
#
# 원칙: **리포트를 본 사람이 30분 안에 같은 가격대로 실제 매수할 수 있어야 한다.**
#   장중에 발행하고, 체결가 = AI가 분석한 그 시세(market.json). 가격을 보고 판단했으니 그 가격에 산다.
#   (룩어헤드 아님 — 손익은 이 시점 '이후' 시세로 결정되고 AI는 그걸 못 본다).
# 🇺🇸 23:30 시작은 서머타임/겨울 모두 미장 개장 후라 연중 안전 (여름 22:30 개장 · 겨울 23:30 개장).
#
# 과금: Claude는 CLAUDE_CODE_OAUTH_TOKEN(내 Max 구독 토큰)으로만 인증 → Max 플랜 사용량에서 차감.
#      ⚠️ ANTHROPIC_API_KEY 는 절대 설정하지 않는다 (설정하면 API 토큰당 과금됨).

permissions:
  contents: write
  issues: write            # 실패 시 이슈로 알리기 위함 (조용한 실패 금지)

# 크론 지연으로 🇰🇷·🇺🇸 런이 겹쳐도 push가 서로를 밀어내지 않게 한다.
concurrency:
  group: daily-market
  cancel-in-progress: false

on:
  schedule:
    # ⚠️ GitHub 예약실행은 최대 2~3시간까지 지연될 수 있다(실측: 크론+2h20m).
    #    그래서 목표(14:10/23:30)보다 ~3h 일찍 걸어, 지연이 있어도 목표 '전'에 시작되게 한다.
    #    실제 시작은 아래 "목표 시각까지 대기" 스텝이 정확히 맞춘다.
    - cron: "0 2 * * 1-5"    # 11:00 KST 크론 → (지연 흡수) → 14:10 시작 → 🇰🇷 리포트 ~14:30
    - cron: "0 11 * * 1-5"   # 20:00 KST 크론 → (지연 흡수) → 23:30 시작 → 🇺🇸 리포트 ~23:45
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드 (장중 실행)"
        type: choice
        options: [kr, us]
        default: kr

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      # ── 모드·목표 시각 결정 (체크아웃 전에 해도 되는 일) ─────────────────
      # 크론 문자열로 모드를 정한다 — 실행 시각(UTC 시)으로 추측하면 지연이 클 때 kr을 us로 오인한다.
      - name: 모드 결정
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          else
            case "${{ github.event.schedule }}" in
              "0 2 * * 1-5")  MODE=kr ;;
              "0 11 * * 1-5") MODE=us ;;
              *) echo "::error::알 수 없는 크론: '${{ github.event.schedule }}'"; exit 1 ;;
            esac
          fi
          case "$MODE" in
            kr) TARGET=14:10 ;;      # → 리포트 ~14:30 (마감 15:30까지 1시간 여유)
            us) TARGET=23:30 ;;      # → 리포트 ~23:45 (연중 미장 개장 후 · 자정 전)
          esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "label=$MODE" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "▶ 모드: $MODE · 목표 시작 $TARGET KST (현재 $(TZ='Asia/Seoul' date +%H:%M))"

      # GitHub 크론 지연을 흡수해 **매일 같은 시각(목표)에 발행**되도록 목표 시각까지 대기.
      # epoch(초)로 계산 → 자정을 넘겨도 안전. 목표를 이미 지났거나 6h 넘게 남았으면 대기 없이 진행.
      - name: 목표 시각까지 대기 (발행 시각 고정)
        run: |
          TARGET="${{ steps.mode.outputs.target }}"                 # 예: 14:10 (KST)
          TE=$(TZ='Asia/Seoul' date -d "$TARGET" +%s)               # 오늘 그 시각의 epoch
          W=$(( TE - $(date +%s) ))
          if [ "$W" -gt 0 ] && [ "$W" -le 21600 ]; then
            echo "▶ 목표 $TARGET KST 까지 $((W/60))분 대기 (현재 $(TZ='Asia/Seoul' date +%H:%M))"
            sleep "$W"
          else
            echo "▶ 대기 없음 (현재 $(TZ='Asia/Seoul' date +%H:%M) KST · 남은 ${W}s — 목표 지났거나 범위 밖)"
          fi
          echo "▶ $(TZ='Asia/Seoul' date +%H:%M) KST — 분석 시작"

      # ⚠️ 체크아웃은 **대기가 끝난 뒤**에 한다.
      #    예전엔 대기 전에 받아서, 실행되는 코드가 3.5시간 전 스냅샷이었다.
      #    (2026-07-30: 14:54에 '평범형 3 폐지'를 커밋했는데 15:06 발행 글엔 "5인"이 그대로 나왔다.)
      - name: 저장소 체크아웃 (대기 후 — 최신 코드로 실행)
        uses: actions/checkout@v4

      # 회차 기준일을 **여기서 한 번 확정**해 이후 모든 단계가 같은 하루를 보게 한다.
      #   ⚠️ 단계마다 date를 새로 부르면 자정을 넘긴 🇺🇸 세션에서 수집·체결 날짜가 갈린다.
      #      (2026-07-28·07-30·07-31 US 주문서 12건이 그렇게 유실됐다 — scripts/_rundate.py 참조)
      - name: 회차 기준일 확정 (RUN_DATE)
        id: rd
        run: |
          RUN_DATE=$(TZ='Asia/Seoul' date +%Y-%m-%d)
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"
          echo "yesterday=$(TZ='Asia/Seoul' date -d "$RUN_DATE -1 day" +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "▶ 회차 기준일 RUN_DATE=$RUN_DATE (이후 모든 단계가 이 날짜를 쓴다)"

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 파이썬 패키지 설치
        run: pip install -r requirements.txt

      - name: 데이터 수집 (시세·경제지표)
        env:
          RUN_DATE: ${{ steps.rd.outputs.run_date }}
        run: python scripts/collect_data.py ${{ steps.mode.outputs.label }}

      - name: 한글 폰트 설치 (차트용)
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum && fc-cache -f

      - name: 차트 생성
        env:
          RUN_DATE: ${{ steps.rd.outputs.run_date }}
        run: python scripts/make_charts.py

      - name: 비인기종목 스크리너 (한국장 예상글 전용)
        if: steps.mode.outputs.mode == 'kr'
        env:
          RUN_DATE: ${{ steps.rd.outputs.run_date }}
        run: python scripts/screener.py || echo "screener 실패(계속 진행)"
        continue-on-error: true

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Claude Code 설치
        run: npm install -g @anthropic-ai/claude-code

      # 1단계 🧑‍💼 포트폴리오 매니저 4인 (각자 독립 세션·독립 계좌)이 먼저 종목을 정한다.
      #    · 성향파 2명 (모델 opus): 🛡️안정 · 🚀공격 — 뚜렷한 색깔을 준 극단 양 끝
      #    · 평범형 2명 (모델 fable): normal1/2 — **완전히 동일한 지시문**의 대조군.
      #      같은 모델·같은 데이터·같은 프롬프트로 판단이 얼마나 갈리는지(편차) 측정용이므로
      #      둘을 의도적으로 다르게 만들지 않는다.
      #    → 4개의 주문서. 전원 effort=xhigh (최고 심층추론).
      #
      #    ⚡ 4인은 서로를 참조하지 않는 **완전 독립 세션**이므로 병렬로 돌린다.
      #       (순차 실행 때문에 발행이 15:27까지 밀렸다 — 2026-08-04 개편)
      #       로그는 섞이지 않게 성향별 파일로 받고, 끝난 뒤 순서대로 출력한다.
      - name: Claude 포트폴리오 매매 결정 × 4인 (병렬 — 종목 확정)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODE: ${{ steps.mode.outputs.mode }}
          REPORT_DATE: ${{ steps.rd.outputs.run_date }}
        run: |
          claude --version
          mkdir -p logs
          run_one() {
            P="$1"
            # 매니저별 모델: 성향파=opus(최신 Opus) / 평범형=fable(최신 Fable)
            case "$P" in
              normal1|normal2) MODEL=fable ;;
              *)               MODEL=opus  ;;
            esac
            PROMPT="$(cat prompts/persona-$P.md prompts/portfolio.md)

          [실행 안내]
          - 오늘 날짜(KST): ${REPORT_DATE}
          - 이번 세션: ${MODE} / 너의 성향 id: ${P}
          - 주문서 파일명은 반드시 portfolio/orders/${REPORT_DATE}-${MODE}-${P}.json
          - 네 계좌 파일: _data/portfolio-${P}.json (없으면 현금 1억 시작)
          - 너는 1차 결정자다. 데이터를 직접 보고 종목을 정하라 (애널리스트 리포트는 아직 없다).
          - git 금지. 주문서 JSON 파일 생성까지만."
            claude -p "$PROMPT" --model "$MODEL" --effort xhigh \
              --permission-mode bypassPermissions --verbose > "logs/mgr-$P.log" 2>&1
          }
          for P in stable aggressive normal1 normal2; do run_one "$P" & done
          wait
          for P in stable aggressive normal1 normal2; do
            echo "───── 포트폴리오 매니저: $P ─────"
            cat "logs/mgr-$P.log" || true
          done
          # 주문서가 하나라도 안 나왔으면 여기서 죽는다 (애널리스트가 빈 손으로 글을 쓰지 않게).
          MISSING=""
          for P in stable aggressive normal1 normal2; do
            F="portfolio/orders/${REPORT_DATE}-${MODE}-${P}.json"
            [ -f "$F" ] || MISSING="$MISSING $F"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::주문서 누락 —$MISSING"
            exit 1
          fi
          echo "▶ 주문서 4인분 확인 완료"

      # 2단계 🧠 애널리스트가 4인의 주문서를 종합해 "오늘의 매수/매도 종목"을 깔끔하게 정리한다.
      - name: Claude 종합 리포트 생성 (4인 주문 종합 — 종목 결론)
        env:
          # 구독(Max) 토큰만 사용. API 키는 넣지 않음 → Max 사용량으로 차감.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODE: ${{ steps.mode.outputs.mode }}
          REPORT_DATE: ${{ steps.rd.outputs.run_date }}
          YESTERDAY: ${{ steps.rd.outputs.yesterday }}
        run: |
          # 작성 시각은 실제 시각을 쓰되, 자정을 넘겼으면 회차 마지막 순간(23:59)으로 고정한다.
          # (글 파일명은 RUN_DATE 기준이므로 front matter가 다음 날로 튀면 목록·URL이 어긋난다)
          if [ "$(TZ='Asia/Seoul' date +%Y-%m-%d)" = "$REPORT_DATE" ]; then
            REPORT_TIME=$(TZ='Asia/Seoul' date +%H:%M)
          else
            REPORT_TIME="23:59"
            echo "::warning::자정을 넘겨 작성 — front matter 시각을 23:59로 고정 (RUN_DATE=$REPORT_DATE)"
          fi
          PROMPT="$(cat prompts/${MODE}-report.md)

          [CI 환경 안내]
          - 오늘 날짜(KST): ${REPORT_DATE} / 어제: ${YESTERDAY}
          - **지금 시각(KST): ${REPORT_TIME}** → front matter의 date를 반드시 \`${REPORT_DATE} ${REPORT_TIME}:00 +0900\` 로 쓸 것 (실제 작성 시각).
          - 방금 4인이 낸 주문서: portfolio/orders/${REPORT_DATE}-${MODE}-{stable,aggressive,normal1,normal2}.json 를 반드시 읽어 종합하라.
          - 모델 구성: 안정형·공격형=opus · 평범형1·2=fable (평범형 둘은 동일 모델·동일 지시문의 대조군).
          - git 명령은 직접 실행하지 마라. 파일 생성까지만 하면 커밋·push는 워크플로가 처리한다."
          # --model opus: 항상 최신 Opus / --effort xhigh: 최고 심층추론
          claude -p "$PROMPT" --model opus --effort xhigh --permission-mode bypassPermissions --verbose

      # 체결가 = AI가 분석한 바로 그 시세(market.json). 가격을 보고 판단했으니 그 가격에 산다.
      # 룩어헤드 아님: 수익은 이 시점 '이후' 가격에서 나오고, AI는 그걸 볼 수 없다.
      - name: 가상 포트폴리오 체결·평가 × 4인 (AI가 본 시세로 체결)
        env:
          RUN_DATE: ${{ steps.rd.outputs.run_date }}
        run: |
          for P in stable aggressive normal1 normal2; do
            echo "───── 체결·평가: $P ─────"
            python scripts/portfolio.py ${{ steps.mode.outputs.label }} $P
          done

      # 보유 종목별 '일별 추이 + 내 매수 시점' 그래프 (포트폴리오 상세에서 종목 펼치면 보임).
      # 4개 계좌를 다 돌린 뒤 한 번만 실행 — 보유 티커 합집합에 대해 티커당 1회만 시세를 받는다.
      # 실패해도 파이프라인을 멈추지 않는다(차트만 빠지고 페이지는 정상).
      - name: 보유 종목별 차트 생성
        run: python scripts/holding_charts.py || echo "보유종목 차트 실패(계속 진행)"
        continue-on-error: true

      # 🧮 AI 채점판 — 커밋된 주문서 전체를 종목 콜 단위로 소급 채점한다.
      #    계좌 수익률은 하루 1표본이라 실력/운 구분이 안 되지만, 종목 콜은 회차당 수십 표본이다.
      #    실패해도 파이프라인을 멈추지 않는다(채점 페이지만 갱신 안 됨).
      - name: AI 채점판 갱신
        env:
          RUN_DATE: ${{ steps.rd.outputs.run_date }}
        run: python scripts/scoreboard.py || echo "채점판 실패(계속 진행)"
        continue-on-error: true

      # ⚠️ 커밋 **전**에 점검한다 — 리포트·주문서 4인·체결 4인이 다 맞아야 게시한다.
      #    (초록불인데 결과물이 비어 있던 2026-07~08 사고 재발 방지)
      - name: 회차 산출물 점검
        env:
          RUN_DATE: ${{ steps.rd.outputs.run_date }}
        run: python scripts/verify_run.py ${{ steps.mode.outputs.mode }}

      - name: 커밋 & 푸시
        run: |
          git config user.name "stock-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf logs
          git pull --rebase --autostash || true
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "auto(${{ steps.mode.outputs.mode }}): ${{ steps.rd.outputs.run_date }} $(TZ='Asia/Seoul' date '+%H:%M')"
            git push
          fi

      # 조용히 실패하지 않는다 — 실패하면 이슈로 알린다(같은 회차 중복 생성은 하지 않는다).
      - name: 실패 알림 (이슈 생성)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ steps.mode.outputs.mode }}
          RUN_DATE: ${{ steps.rd.outputs.run_date }}
        run: |
          TITLE="🚨 자동 실행 실패 — ${RUN_DATE:-?} / ${MODE:-?}"
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if gh issue list --state open --search "$TITLE" --json title \
               --jq '.[].title' | grep -qxF "$TITLE"; then
            echo "이미 같은 제목의 열린 이슈가 있다 — 생성 생략"
            exit 0
          fi
          gh issue create --title "$TITLE" --body "$(printf '%s\n' \
            "회차 \`${RUN_DATE:-?}\` / \`${MODE:-?}\` 실행이 실패했습니다." \
            "" \
            "- 실행 로그: $URL" \
